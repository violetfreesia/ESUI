name: Wails build

on:
  release:
    types: [created]

permissions:
  contents: write
  actions: read

env:
  APP_NAME: 'ESUI'
  APP_WORKING_DIRECTORY: '.'
  GO_VERSION: '1.25'

jobs:
  # =========================
  # Windows
  # =========================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Build & Compress
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

          wails build `
            -ldflags="-X 'app/backend/common.Version=${{ github.ref_name }}'" `
            -webview2 download `
            -o ${{ env.APP_NAME }}.exe

          Copy-Item readme.md build/bin/
          Copy-Item LICENSE build/bin/

          & "C:\Program Files\7-Zip\7z.exe" a `
            "${{ env.APP_NAME }}-${{ github.ref_name }}-windows-x64.7z" `
            ".\build\bin\*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ env.APP_NAME }}-${{ github.ref_name }}-windows-x64.7z
          if-no-files-found: error

  # =========================
  # macOS Universal
  # =========================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build & Compress
        shell: bash
        run: |
          set -e

          go install github.com/wailsapp/wails/v2/cmd/wails@latest

          wails build \
            -ldflags "-X 'app/backend/common.Version=${{ github.ref_name }}'" \
            -platform darwin/universal \
            -o "${{ env.APP_NAME }}"

          mkdir -p _build _dist

          cp -r "./build/bin/${{ env.APP_NAME }}.app" _build/
          brew install create-dmg

          create-dmg \
            --no-internet-enable \
            --volname "${{ env.APP_NAME }}" \
            --volicon "_build/${{ env.APP_NAME }}.app/Contents/Resources/iconfile.icns" \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon "${{ env.APP_NAME }}.app" 180 180 \
            --icon-size 100 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 480 180 \
            "_dist/${{ env.APP_NAME }}-${{ github.ref_name }}-macos.dmg" \
            "_build/"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: _dist/*.dmg
          if-no-files-found: error

  # =========================
  # Linux
  # =========================
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build & Compress
        shell: bash
        run: |
          set -e

          ARCH=$(uname -m)

          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential

          go install github.com/wailsapp/wails/v2/cmd/wails@latest

          wails build \
            -ldflags="-X 'app/backend/common.Version=${{ github.ref_name }}'" \
            -o "${{ env.APP_NAME }}"

          mkdir -p _temp_dist

          cp readme.md LICENSE _temp_dist/
          cp -r build/bin/* _temp_dist/

          chmod +x _temp_dist/*

          tar -zcvf \
            "${{ env.APP_NAME }}-${{ github.ref_name }}-ubuntu-${ARCH}.tar.gz" \
            -C _temp_dist .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ env.APP_NAME }}-${{ github.ref_name }}-ubuntu-*.tar.gz
          if-no-files-found: error

  # =========================
  # Publish Release Assets
  # =========================
  publish-release:
    needs:
      - build-windows
      - build-macos
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
